name: Verify MCP package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check source and build package
        run: |
          uv sync --locked
          uv run --frozen bash ./test.sh
      - name: Install built wheel outside checkout and check protocol
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/mcp-requirements.txt"
          uv venv --python '${{ matrix.python }}' "$RUNNER_TEMP/mcp-clean"
          if [ -x "$RUNNER_TEMP/mcp-clean/bin/python" ]; then
            py="$RUNNER_TEMP/mcp-clean/bin/python"
            smoke="$RUNNER_TEMP/mcp-clean/bin/uthana-mcp-smoke"
          else
            py="$RUNNER_TEMP/mcp-clean/Scripts/python.exe"
            smoke="$RUNNER_TEMP/mcp-clean/Scripts/uthana-mcp-smoke.exe"
          fi
          # Locked sync can use wheel URLs while index metadata predates the SDK release.
          uv pip install --refresh-package uthana --python "$py" -r "$RUNNER_TEMP/mcp-requirements.txt" dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH -u UTHANA_API_KEY "$smoke"
