name: Verify MCP package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Check source and build package
        run: |
          uv sync --locked
          uv run --frozen ./test.sh
      - name: Install built wheel outside checkout and check protocol
        run: |
          uv venv --python '${{ matrix.python }}' "$RUNNER_TEMP/mcp-clean"
          uv pip install --python "$RUNNER_TEMP/mcp-clean/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH -u UTHANA_API_KEY -u UTHANA_API_KEY_FILE \
            "$RUNNER_TEMP/mcp-clean/bin/uthana-mcp-smoke"
