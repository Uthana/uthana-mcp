name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and publish --dry-run (no upload to PyPI)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Detect release
        id: detect
        run: |
          VERSION=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          STATUS=$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/uthana-mcp/${VERSION}/json")
          case "$STATUS" in
            200) echo "should_release=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "should_release=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "PyPI version check failed with HTTP $STATUS" >&2; exit 1 ;;
          esac
      - name: Run tests
        if: steps.detect.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
        run: uv run --locked bash ./test.sh
      - name: Check client release prerequisite
        if: steps.detect.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          if "uthana" in config.get("tool", {}).get("uv", {}).get("sources", {}):
              raise SystemExit("Publish the Uthana client, remove its review source pin, and refresh uv.lock before release.")
          PY
      - name: Publish to PyPI
        if: steps.detect.outputs.should_release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            uv publish --dry-run
          else
            uv publish --trusted-publishing always
          fi
      - name: Create and push release tag
        if: steps.detect.outputs.should_release == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
      - name: Create GitHub Release
        if: steps.detect.outputs.should_release == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.detect.outputs.version }}" \
            --title "v${{ steps.detect.outputs.version }}" \
            --generate-notes
