name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and publish --dry-run (no upload to PyPI)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Detect release
        id: detect
        run: |
          VERSION=$(python -c "
          import re, pathlib
          content = pathlib.Path('pyproject.toml').read_text()
          m = re.search(r'^version = \"([^\"]+)\"', content, re.MULTILINE)
          print(m.group(1))
          ")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if curl -sf "https://pypi.org/pypi/uthana-mcp/${VERSION}/json" > /dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already on PyPI — skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not yet on PyPI — will release."
          fi
      - name: Run tests
        if: steps.detect.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
        run: uv run --locked ./test.sh
      - name: Publish to PyPI
        if: steps.detect.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            uv publish --dry-run
          else
            uv publish --trusted-publishing always
          fi
      - name: Create and push release tag
        if: steps.detect.outputs.should_release == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
      - name: Create GitHub Release
        if: steps.detect.outputs.should_release == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.detect.outputs.version }}" \
            --title "v${{ steps.detect.outputs.version }}" \
            --generate-notes
