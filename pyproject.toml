[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uthana-mcp"
version = "0.2.0"
readme = "README.md"
description = "Local MCP adapter for Uthana motion operations"
license = "Apache-2.0 AND LicenseRef-Uthana-Tar-Demo-1.0"
license-files = ["LICENSE", "examples/tar/LICENSE.md"]
authors = [{name = "Uthana, Inc."}]
keywords = ["mcp", "uthana", "animation", "motion", "character"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "uthana>=0.8.0",
    "mcp==1.30.0",
    "httpx==0.28.1",
    "starlette==1.9.0",
    "Pillow==13.0.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
]

# Temporary until the Python client release that includes motions.share is published; remove before release.
[tool.uv.sources]
uthana = { git = "https://github.com/Uthana/uthana-python-client", rev = "ae0883f89d3ba045955956433f10285b8f453e31" }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "build==1.6.1",
    "setuptools>=77",
    "wheel>=0.45",
    "ruff==0.16.7",
    "black==26.5.1",
    "isort==7.0.0",
    "flake8==7.3.0",
    "pytest-cov==7.1.0",
]

[project.urls]
Homepage = "https://uthana.com"
Documentation = "https://uthana.com/docs/api"
Repository = "https://github.com/Uthana/uthana-mcp"
Issues = "https://github.com/Uthana/uthana-mcp/issues"
Changelog = "https://github.com/Uthana/uthana-mcp/releases"

[project.scripts]
uthana-mcp = "uthana_mcp.server:main"
uthana-mcp-smoke = "uthana_mcp.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uthana_mcp = ["WORKFLOW.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["uthana_mcp"]
parallel = true
patch = ["subprocess"]
omit = ["*/uthana_mcp/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["uthana_mcp"]
known_third_party = ["uthana", "mcp", "httpx", "PIL", "pydantic", "pytest", "fakes", "platform_support", "dotenv"]
