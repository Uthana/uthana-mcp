[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uthana-mcp"
version = "0.1.0"
readme = "README.md"
description = "Local MCP adapter for Uthana motion operations"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Uthana, Inc."}]
requires-python = ">=3.11"
dependencies = [
    # Temporary source pin until the shared client has a reviewed release.
    "uthana @ git+https://github.com/Uthana/uthana-python-client.git@5c934a183ae18b47de63160e3933f6810939a74b",
    "mcp==1.30.0",
    "httpx==0.28.1",
    "Pillow==12.3.0",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "build==1.6.1",
    "setuptools>=77",
    "wheel>=0.45",
    "ruff==0.16.7",
    "black==26.5.1",
    "isort==7.0.0",
    "flake8==7.3.0",
]

[project.urls]
Homepage = "https://uthana.com"
Documentation = "https://uthana.com/docs/api"
Repository = "https://github.com/Uthana/uthana-mcp"
Issues = "https://github.com/Uthana/uthana-mcp/issues"

[project.scripts]
uthana-mcp = "uthana_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uthana_mcp = ["WORKFLOW.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["uthana_mcp"]
known_third_party = ["uthana", "mcp", "httpx", "PIL", "pydantic", "pytest", "fakes"]
